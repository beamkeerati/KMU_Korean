<title>KMU 모의시험</title>

<style>
/* Layout: exam papers on a desk — a home board of the three exams, then per set: cover page → paper (exam or practice) → results.
   The teacher's red pen grades. */
:root {
  --desk: #e9edf2; --paper: #ffffff; --ink: #1b2533; --muted: #5d6b7c; --rule: #d5dce5;
  --navy: #0f4c81; --navy-soft: #e6eef7; --red: #d22f2f; --red-soft: #fdecec; --ok: #1f7a4d; --ok-soft: #e5f4ec; --hi: #fff4c2; --half: #b45309; --half-soft: #fdefd9; --tip: #2f6b8f;
  --f-ko: "Noto Sans KR", "Noto Sans Thai", system-ui, sans-serif;
  --f-th: "Noto Sans Thai", "Noto Sans KR", system-ui, sans-serif;
  --f-disp: "Noto Serif KR", "Noto Sans KR", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #10151c; --paper: #18202b; --ink: #e4e9f0; --muted: #9aa8b8; --rule: #2c3846; --navy: #7fb2e5; --navy-soft: #1d2b3b;
  --red: #ff6b6b; --red-soft: #3a1f22; --ok: #5fd39a; --ok-soft: #173126; --hi: #3d3720; --half: #f2a541; --half-soft: #3a2c17; --tip: #8fc1e3; color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #10151c; --paper: #18202b; --ink: #e4e9f0; --muted: #9aa8b8; --rule: #2c3846; --navy: #7fb2e5; --navy-soft: #1d2b3b;
  --red: #ff6b6b; --red-soft: #3a1f22; --ok: #5fd39a; --ok-soft: #173126; --hi: #3d3720; --half: #f2a541; --half-soft: #3a2c17; --tip: #8fc1e3; color-scheme: dark }
/* colour tones (the red pen stays red in every tone) */
:root[data-palette="sakura"] { --desk: #f7eaee; --paper: #fffafb; --rule: #ecd3dc; --navy: #a8326e; --navy-soft: #fbe4ee; --hi: #fff1c9; }
@media (prefers-color-scheme: dark) { :root[data-palette="sakura"]:not([data-theme="light"]) { --desk: #1a1216; --paper: #24191f; --rule: #3d2a33; --navy: #f08cb8; --navy-soft: #3a2230; --hi: #3d3720; } }
:root[data-palette="sakura"][data-theme="dark"] { --desk: #1a1216; --paper: #24191f; --rule: #3d2a33; --navy: #f08cb8; --navy-soft: #3a2230; --hi: #3d3720; }
:root[data-palette="mint"] { --desk: #e4efea; --paper: #fbfefd; --rule: #cde0d7; --navy: #1f6e5a; --navy-soft: #dcf0e7; --hi: #fff4c2; }
@media (prefers-color-scheme: dark) { :root[data-palette="mint"]:not([data-theme="light"]) { --desk: #0f1714; --paper: #16211d; --rule: #284038; --navy: #6fd2b0; --navy-soft: #1a3229; --hi: #3d3720; } }
:root[data-palette="mint"][data-theme="dark"] { --desk: #0f1714; --paper: #16211d; --rule: #284038; --navy: #6fd2b0; --navy-soft: #1a3229; --hi: #3d3720; }
:root[data-palette="peach"] { --desk: #f6ece3; --paper: #fffcf8; --rule: #ead7c8; --navy: #b4531f; --navy-soft: #fbe7d8; --hi: #fff3c4; }
@media (prefers-color-scheme: dark) { :root[data-palette="peach"]:not([data-theme="light"]) { --desk: #18120e; --paper: #221a14; --rule: #3f2f24; --navy: #f3a273; --navy-soft: #3a2619; --hi: #3d3720; } }
:root[data-palette="peach"][data-theme="dark"] { --desk: #18120e; --paper: #221a14; --rule: #3f2f24; --navy: #f3a273; --navy-soft: #3a2619; --hi: #3d3720; }
:root[data-palette="lavender"] { --desk: #ecebf6; --paper: #fdfcff; --rule: #d9d4ee; --navy: #5b45a8; --navy-soft: #ebe6fb; --hi: #fff4c2; }
@media (prefers-color-scheme: dark) { :root[data-palette="lavender"]:not([data-theme="light"]) { --desk: #12111a; --paper: #1b1925; --rule: #322d48; --navy: #b3a3f5; --navy-soft: #2a2443; --hi: #3d3720; } }
:root[data-palette="lavender"][data-theme="dark"] { --desk: #12111a; --paper: #1b1925; --rule: #322d48; --navy: #b3a3f5; --navy-soft: #2a2443; --hi: #3d3720; }
:root[data-palette="graphite"] { --desk: #ebebec; --paper: #ffffff; --rule: #d6d6da; --navy: #2f3640; --navy-soft: #ececf0; --hi: #fff4c2; }
@media (prefers-color-scheme: dark) { :root[data-palette="graphite"]:not([data-theme="light"]) { --desk: #111214; --paper: #1a1c1f; --rule: #303338; --navy: #cfd5dd; --navy-soft: #262a30; --hi: #3d3720; } }
:root[data-palette="graphite"][data-theme="dark"] { --desk: #111214; --paper: #1a1c1f; --rule: #303338; --navy: #cfd5dd; --navy-soft: #262a30; --hi: #3d3720; }
.swatches { display: flex; gap: 6px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--rule); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* the page scrolls inside #scroller, not the document: iPad Safari grows an iframe to its content height, which would make the
   outer claude.ai page scroll and carry the sticky strip / progress bar away. A fixed full-viewport scroller keeps them on screen. */
html, body { height: 100%; overflow: hidden; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-th); font-size: calc((15px) * var(--ts, 1)); line-height: 1.65; margin: 0; padding: 0; }
#scroller { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.ko { font-family: var(--f-ko); }
.muted { color: var(--muted); }

/* top strip: brand · settings menu · help · sync state */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.strip-in { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: calc((17px) * var(--ts, 1)); margin-right: auto; background: none; border: 0; padding: 4px 0; text-align: left; min-width: 0; }
.brand small { font-family: var(--f-th); font-weight: 500; font-size: calc((12px) * var(--ts, 1)); color: var(--muted); margin-left: 6px; }
.sync { font-size: calc((12px) * var(--ts, 1)); color: var(--muted); white-space: nowrap; }
.sync:empty { display: none; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); white-space: nowrap; min-height: 34px; display: flex; align-items: center; }
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary { border-color: var(--navy); color: var(--navy); }
.menu .pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 7; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.ctl select { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 4px 6px; min-height: 32px; color: var(--ink); }
@media (max-width: 520px) { .brand small { display: none; } }

.wrap { max-width: 900px; margin: 18px auto 0; padding-bottom: 80px; }
.exam { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 18px clamp(14px, 3vw, 26px); margin-bottom: 14px; }
.exam-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.exam-h h2 { font-family: var(--f-disp); font-size: calc((clamp(18px, 2.6vw, 22px)) * var(--ts, 1)); margin: 0; }
.dday { font-family: var(--f-ko); font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.exam-h p { margin: 0; width: 100%; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.exam-sum { font-size: calc((13px) * var(--ts, 1)); color: var(--muted); margin: 8px 0 0; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
.card { text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 12px 14px; display: grid; gap: 3px; min-width: 0; min-height: 44px; }
.card:hover { border-color: var(--navy); }
.card .sk { font-size: calc((12px) * var(--ts, 1)); color: var(--muted); letter-spacing: .04em; }
.card .tt { font-family: var(--f-ko); font-weight: 700; line-height: 1.4; }
.card .meta { font-size: calc((12px) * var(--ts, 1)); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { justify-self: start; font-size: calc((12px) * var(--ts, 1)); font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); font-variant-numeric: tabular-nums; margin-top: 3px; }
.badge.good { background: var(--ok-soft); color: var(--ok); }
.badge.live { background: var(--hi); color: var(--ink); }
.badge.none { background: transparent; color: var(--muted); font-weight: 500; padding: 0; }
.grp { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--rule); }
.exam-sum + .grp { border-top: 0; padding-top: 4px; }
.grp-note { margin: -2px 0 8px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.grp-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: calc((14px) * var(--ts, 1)); }
.grp-h b { font-size: calc((15px) * var(--ts, 1)); }
.grp-bar { flex: 1; min-width: 80px; max-width: 220px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.grp-bar i { display: block; height: 100%; background: var(--ok); }
.skills.four { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }
@media (max-width: 640px) { .skills.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card .tt small { font-family: var(--f-th); font-weight: 500; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.card.c-good { border-color: var(--ok); } .card.c-done { border-color: var(--navy); } .card.c-live { border-color: var(--half); }
.home-tip { font-size: calc((13px) * var(--ts, 1)); color: var(--muted); margin: 0 0 12px; }

/* home hub → category page → unit page → set cover */
.hub-h { font-family: var(--f-disp); font-size: calc((17px) * var(--ts, 1)); margin: 22px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.hub-h small { font-family: var(--f-th); font-weight: 500; font-size: calc((12.5px) * var(--ts, 1)); color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { position: relative; text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 44px 14px 16px; display: grid; gap: 5px; min-height: 124px; align-content: start; min-width: 0; }
.tile:hover { border-color: var(--navy); box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
.tile .ic { font-size: 26px; line-height: 1; }
.tile .t { font-family: var(--f-ko); font-weight: 800; font-size: calc((18px) * var(--ts, 1)); line-height: 1.3; }
.tile .s { font-size: calc((13px) * var(--ts, 1)); color: var(--muted); line-height: 1.5; }
.tile .m { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: calc((12px) * var(--ts, 1)); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .grp-bar { max-width: none; width: 100%; flex: none; }
.tile .go { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 28px; line-height: 1; color: var(--navy); font-weight: 700; }
.tile.hero { grid-column: 1 / -1; border: 2px solid var(--navy); background: var(--navy-soft); min-height: 0; }
.tile.hero .t { font-size: calc((clamp(21px, 3vw, 27px)) * var(--ts, 1)); }
.tile .dday { font-size: .72em; margin-left: 8px; padding: 1px 10px; border-radius: 999px; background: var(--red-soft); white-space: nowrap; }
.resume-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; background: var(--hi); border: 1px solid var(--half); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: calc((13px) * var(--ts, 1)); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); margin: 0 0 10px; }
.crumb { background: none; border: 0; padding: 6px 4px; min-height: 36px; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 12px; }
.utile { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-height: 112px; min-width: 0; }

.paper { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 22px clamp(14px, 4vw, 40px) 30px; }

.cover-title { text-align: center; border: 2px solid var(--ink); padding: 20px 16px 16px; margin-top: 4px; }

.cover-title h1 { font-family: var(--f-disp); font-size: calc((clamp(22px, 3.4vw, 30px)) * var(--ts, 1)); margin: 6px 0 4px; line-height: 1.3; text-wrap: balance; }
.cover-exam { font-family: var(--f-ko); color: var(--navy); font-weight: 700; }
.cover-meta { display: inline-grid; grid-template-columns: auto auto auto auto; gap: 4px 18px; margin: 14px auto 0; font-family: var(--f-ko); font-variant-numeric: tabular-nums; border-top: 1px solid var(--rule); padding-top: 12px; }
.cover-meta span { color: var(--muted); font-size: calc((13px) * var(--ts, 1)); display: block; }
.cover-meta b { font-size: calc((16px) * var(--ts, 1)); }
.rules { border-left: 3px solid var(--navy); background: var(--navy-soft); padding: 10px 14px; margin: 16px 0 0; border-radius: 0 6px 6px 0; }

@media (max-width: 560px) { .modes { grid-template-columns: 1fr; } .cover-meta { grid-template-columns: auto auto; } }

/* paper in progress */
.exambar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0 4px; padding: 8px 12px; background: var(--navy-soft); border-radius: 6px; font-size: calc((14px) * var(--ts, 1)); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 4px; }
.btn { border: 1px solid var(--navy); background: var(--paper); color: var(--navy); padding: 7px 14px; border-radius: 6px; font-weight: 500; min-height: 40px; }
.btn.primary { background: var(--navy); color: var(--paper); }

.box { border: 1px solid var(--ink); border-radius: 4px; padding: 6px 12px; font-family: var(--f-ko); margin: 6px 0 8px; white-space: pre-line; }
.passage { border-left: 3px solid var(--rule); padding: 4px 0 4px 12px; margin: 6px 0 10px; }
.passage p { margin: 0 0 4px; }
.passage .ko { display: block; }
.passage .th, .script .th { display: block; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.lst { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 8px; }
.play { border: 1px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 999px; padding: 4px 12px; font-size: calc((13px) * var(--ts, 1)); min-height: 32px; }
.g-status { font-size: calc((13px) * var(--ts, 1)); color: var(--muted); font-variant-numeric: tabular-nums; }

.secbar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; margin: 2px 0 8px; }
.secbar i { display: block; height: 100%; background: var(--red); width: 0; transition: width .5s linear; }
.secbar:not(.on) { display: none; }

.script { margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--navy); background: var(--navy-soft); border-radius: 0 6px 6px 0; }

/* exam mode hides every Thai gloss and hint until the student asks for them or submits */
.paper.exam:not(.show-th) .passage .th, .paper.exam:not(.show-th) .qth.tr, .paper.exam:not(.show-th) .opt .th, .paper.exam:not(.show-th) .sec-th { display: none; }
.paper.exam .hint { display: none; }

.item { position: relative; padding: 9px 0 9px 44px; border-top: 1px dashed var(--rule); scroll-margin-top: 70px; }
.item:first-of-type { border-top: 0; }
.qn { position: absolute; left: 0; top: 9px; font-family: var(--f-ko); font-weight: 700; width: 40px; overflow-wrap: anywhere; font-size: calc((14px) * var(--ts, 1)); }
.q { font-family: var(--f-ko); white-space: pre-line; }
.qth { font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.pic { font-size: calc((13px) * var(--ts, 1)); }
/* real pictures (crops of the book / teacher's paper, content/img/*.tsv): tap to see one full width */
.pics { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin: 6px 0 4px; }
.pimg { display: block; max-width: 100%; height: auto; border-radius: 4px; background: #fff; cursor: zoom-in; }
.pimg.big { width: 100% !important; cursor: zoom-out; }
.pimg-wait { display: grid; place-items: center; max-width: 100%; border: 1px dashed var(--rule); border-radius: 4px; color: var(--muted); }
.paper.exam:not(.show-th) .pic-cap { display: none; }
/* long written answers (essays): a big ruled box using the full paper width, a character count, and a full-screen writing popup */
textarea.wa.long { min-height: calc(1.95em * 10 + 4px); margin-left: -44px; width: calc(100% + 44px); border: 1px solid var(--rule); border-bottom: 1.5px solid var(--ink); border-radius: 4px 4px 0 0; padding: 0 10px; resize: vertical; }
.wa-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 10px; margin: 6px 0 0 -44px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.wa-tools .cnt.ok { color: var(--ok); font-weight: 600; }
.wa-tools.short { margin-top: 2px; justify-content: flex-end; }
.wa-tools.short .play { padding: 2px 10px; min-height: 28px; font-size: calc((12px) * var(--ts, 1)); }
.bw { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .5); display: flex; justify-content: center; align-items: stretch; padding: max(10px, env(safe-area-inset-top, 0px)) 10px max(10px, env(safe-area-inset-bottom, 0px)); }
.bw-in { background: var(--paper); color: var(--ink); width: min(1240px, 100%); border-radius: 8px; padding: 14px clamp(12px, 3vw, 32px); display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.bw-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.bw .box { margin: 0; }
.bw-ta { flex: 1; min-height: 45vh; width: 100%; font-family: var(--f-ko); font-size: calc((19px) * var(--ts, 1)); line-height: 2.1em; color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 14px;
  background: var(--paper) repeating-linear-gradient(transparent 0 calc(2.1em - 1px), var(--rule) calc(2.1em - 1px) 2.1em); background-attachment: local; resize: none; }
.bw-foot { display: flex; justify-content: space-between; gap: 10px; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; }
.opt { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; background: var(--paper); cursor: pointer; min-height: 40px; }

.opt .th { font-size: calc((12px) * var(--ts, 1)); color: var(--muted); }
.bl { border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 4px 4px; width: 7.5em; max-width: 100%; font-family: var(--f-ko); min-height: 36px; font-size: calc((16px) * var(--ts, 1)); }
.conj { display: grid; gap: 6px; }
.conj-base { font-size: calc((17px) * var(--ts, 1)); }
.conj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 6px 14px; }
.conj-cell { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.conj-lab { color: var(--muted); font-size: calc((14px) * var(--ts, 1)); white-space: nowrap; min-width: 6.5em; }
.conj-cell .bl { flex: 1; width: auto; min-width: 5em; }
.nw { white-space: nowrap; display: inline-flex; align-items: baseline; flex-wrap: nowrap; max-width: 100%; }
.bl.ok { border-color: var(--ok); } .bl.ng { border-color: var(--red); color: var(--red); } .bl.half { border-color: var(--red); }
textarea.wa { width: 100%; margin-top: 6px; border: 0; border-bottom: 1.5px solid var(--ink); background: repeating-linear-gradient(transparent 0 1.9em, var(--rule) 1.9em calc(1.9em + 1px)); line-height: 1.95em; padding: 0 4px; font-family: var(--f-ko); min-height: 2.1em; resize: vertical; font-size: calc((16px) * var(--ts, 1)); }
.item.done { background: var(--navy-soft); box-shadow: 0 0 0 6px var(--navy-soft); border-radius: 2px; border-top-color: transparent; }
.item.done + .item { border-top-color: transparent; }
.item.done::before { content: ""; position: absolute; left: -6px; top: 4px; bottom: 4px; width: 4px; border-radius: 2px; background: var(--navy); }
.item.done .qn { color: var(--navy); }
.item.live { outline: 2px solid var(--navy); outline-offset: 6px; border-radius: 2px; background: var(--navy-soft); }
.item.g-ok, .item.g-half, .item.g-ng, .item.g-pend { border-radius: 2px; border-top-color: transparent; }
.item.g-ok { background: var(--ok-soft); box-shadow: 0 0 0 6px var(--ok-soft); }
.item.g-half { background: var(--half-soft); box-shadow: 0 0 0 6px var(--half-soft); }
.item.g-ng { background: var(--red-soft); box-shadow: 0 0 0 6px var(--red-soft); }
.item.g-pend { background: var(--desk); box-shadow: 0 0 0 6px var(--desk); }
.item.g-ok::before, .item.g-half::before, .item.g-ng::before, .item.g-pend::before { content: ""; position: absolute; left: -6px; top: 4px; bottom: 4px; width: 5px; border-radius: 2px; }
.item.g-ok::before { background: var(--ok); } .item.g-half::before { background: var(--half); } .item.g-ng::before { background: var(--red); } .item.g-pend::before { background: var(--muted); }
.item.g-ok .qn { color: var(--ok); } .item.g-half .qn { color: var(--half); } .item.g-ng .qn { color: var(--red); }
.item + .item.g-ok, .item + .item.g-half, .item + .item.g-ng, .item + .item.g-pend { border-top-color: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: calc((13px) * var(--ts, 1)); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-ok::before { background: var(--ok); } .legend .l-half::before { background: var(--half); } .legend .l-ng::before { background: var(--red); } .legend .l-pend::before { background: var(--muted); }
.self button.v-o { border-color: var(--ok); color: var(--ok); } .self button.v-h { border-color: var(--half); color: var(--half); }
.self button.v-o[aria-pressed="true"] { background: var(--ok); color: var(--paper); } .self button.v-h[aria-pressed="true"] { background: var(--half); color: var(--paper); }
.mark { display: none; }
.mark svg { width: 100%; height: 100%; overflow: visible; }
.mark path, .mark circle { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; }
.mark .pend { display: grid; place-items: center; width: 30px; height: 30px; margin: 4px; border: 2px dashed var(--muted); border-radius: 50%; color: var(--muted); font-weight: 800; font-size: calc((16px) * var(--ts, 1)); }
.fix { display: block; font-size: calc((13px) * var(--ts, 1)); margin-top: 4px; font-family: var(--f-ko); }
.fix.corr { color: var(--red); }                                   /* a correction under a wrong or half-right answer */
.fix.tip { color: var(--tip); }                                    /* advice under an answer that is already right */
.fix.tip .th { color: var(--tip); }
.fix .th { font-family: var(--f-th); }
.fix .fx { display: grid; grid-template-columns: 6.5em 1fr; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--rule); }
.fix .fx:first-child { border-top: 0; }
.fix .fx-l { font-family: var(--f-th); font-weight: 700; color: var(--muted); white-space: nowrap; }
.fix .fx > span:last-child { color: var(--ink); }
.fix .fx:first-child > span:last-child { color: inherit; }
.fix .th.hint { color: var(--muted); font-size: .92em; }
.self { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.self button { border: 1px solid var(--red); background: var(--paper); color: var(--red); border-radius: 4px; padding: 2px 9px; font-size: calc((13px) * var(--ts, 1)); min-height: 30px; }
.self button[aria-pressed="true"] { background: var(--red); color: var(--paper); }
.aibtn { border: 1px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 4px; padding: 2px 9px; font: inherit; font-size: calc((13px) * var(--ts, 1)); margin-left: 6px; cursor: pointer; min-height: 30px; }
.aibtn:disabled { opacity: .5; cursor: default; }
.aifb { display: block; margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--navy); background: var(--paper); border-radius: 0 6px 6px 0; color: var(--ink); font-size: calc((13px) * var(--ts, 1)); font-family: var(--f-th); }
.aifb b.ko { font-family: var(--f-ko); }
.tag { font-size: calc((11px) * var(--ts, 1)); font-weight: 700; border-radius: 4px; padding: 0 5px; background: var(--navy-soft); color: var(--navy); margin-left: 6px; vertical-align: middle; }
.zero { font-size: calc((12px) * var(--ts, 1)); color: var(--muted); }
.checks { list-style: none; margin: 6px 0 0; padding: 0; font-size: calc((14px) * var(--ts, 1)); display: grid; gap: 2px; }
.checks li::before { content: "○ "; color: var(--ok); font-weight: 700; }
.checks li.ng::before { content: "✕ "; color: var(--red); }
.reset { margin: 8px 0 0; font-size: calc((13px) * var(--ts, 1)); color: var(--muted); } .btn.danger { border-color: var(--red); color: var(--red); }
.checks li.hint { color: var(--muted); font-size: calc((12px) * var(--ts, 1)); } .checks li.hint::before { content: "ℹ️ "; }
.rec { display: inline-flex; align-items: center; gap: 6px; color: var(--red); font-size: calc((13px) * var(--ts, 1)); font-weight: 500; font-variant-numeric: tabular-nums; }
.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } .secbar i { transition: none; } }
audio { height: 32px; max-width: 100%; }

/* results card */
.results { margin: 16px 0 6px; border: 2px solid var(--red); border-radius: 10px; padding: 14px 18px; background: var(--red-soft); display: grid; gap: 10px; }
.results .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.results .stamp { font-family: var(--f-disp); font-size: calc((42px) * var(--ts, 1)); font-weight: 800; color: var(--red); line-height: 1; font-variant-numeric: tabular-nums; }

/* floating dock: exam clock · answered count · AI state */
.dock { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 6;
  display: flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); box-shadow: 0 4px 16px rgba(0,0,0,.18); overflow: hidden; font-size: calc((14px) * var(--ts, 1)); max-width: calc(100vw - 32px); }

@media (max-width: 420px) { .dock .bar { display: none; } .dock button { padding: 8px 10px; } }

/* big progress panel, sticky under the top strip */
.prog { position: sticky; top: var(--strip-h, 52px); z-index: 4; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px 10px; margin: 10px 0 4px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.prog-row { display: flex; align-items: baseline; gap: 10px; font-size: calc((15px) * var(--ts, 1)); font-variant-numeric: tabular-nums; }
.prog-row .sp { flex: 1; }
.prog-row #prog-p { color: var(--muted); font-size: calc((13px) * var(--ts, 1)); }
#prog-t { font-family: var(--f-ko); font-size: calc((18px) * var(--ts, 1)); } #prog-t.warn { color: var(--red); }
.prog-bar { height: 12px; background: var(--rule); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.prog-bar i { display: block; height: 100%; width: 0; background: var(--navy); border-radius: 6px; transition: width .3s; }
.prog.all .prog-bar i#prog-a { background: var(--ok); }
.prog-bar.time { height: 6px; } .prog-bar.time i { background: var(--muted); transition: width 1s linear; } .prog-bar.time i.warn { background: var(--red); }
/* split layout (wide screens only) */
:root[data-layout="split"] .wrap { max-width: 1400px; }
@media (min-width: 900px) {
  :root[data-layout="split"] #paper .sec { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0 28px; align-items: start; }
  :root[data-layout="split"] #paper .sec-l { position: sticky; top: calc(var(--strip-h, 52px) + 86px); max-height: calc(100vh - var(--strip-h, 52px) - 100px); overflow: auto; padding-right: 6px; }
  :root[data-layout="split"] #paper .sec-r { border-left: 1px solid var(--rule); padding-left: 22px; }
  :root[data-layout="split"] #paper .sec-r .item:first-child { padding-top: 0; }
}
.tp { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; align-items: center; gap: 6px;
  background: var(--paper); border: 1px solid var(--navy); border-radius: 999px; padding: 6px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: calc(100vw - 32px); }
.tp button { border: 0; background: var(--navy-soft); color: var(--navy); border-radius: 50%; width: 36px; height: 36px; font-size: calc((15px) * var(--ts, 1)); display: grid; place-items: center; }
.tp input[type=range] { width: 160px; accent-color: var(--navy); }

@media (max-width: 640px) { .tp { bottom: max(72px, calc(env(safe-area-inset-bottom, 0px) + 72px)); } .tp input[type=range] { width: 90px; } }
.help h2 { font-family: var(--f-disp); font-size: calc((18px) * var(--ts, 1)); margin: 20px 0 6px; }

@media (max-width: 520px) { .paper-head { grid-template-columns: 1fr; } .item { padding-left: 38px; } .paper { padding-left: 12px; padding-right: 12px; } }
/* score profile */
.prof .ph3 { font-size: calc((15px) * var(--ts, 1)); margin: 18px 0 6px; }
.ptw { overflow-x: auto; }
.ptab { width: 100%; border-collapse: collapse; font-size: calc((13px) * var(--ts, 1)); min-width: 560px; font-variant-numeric: tabular-nums; }

  groups.forEach(g => g.sets.sort((a, b) => ORDER.indexOf(a.skill) - ORDER.indexOf(b.skill) || a.id.localeCompare(b.id, undefined, { numeric: true })));

/* dialogue prompts: every speaker turn on its own line ("가: …? 나: …" → two lines); the label must follow sentence-final

const SPK = /[ \t]+(?=(?:가|나|다|라|A|B|남자|여자|[가-힣]{1,4} 씨)[ \t]?:[ \t])|(?<=[.?!。)）]|___)[ \t]+(?=[가-힣A-Za-z]{1,5}[ \t]?:[ \t])/g;

  let q;
  if (it.type === 'blank') {
    /* a conjugation row "받다 → -았/었/였어요 ___ · -(스)ㅂ니다 ___ · …" becomes a grid: the base word, then label + box pairs */
    const qt = dlg(it.q), cm = /^([^→\n]{1,24}?)\s*→\s*(.+)$/s.exec(qt), segs = cm ? cm[2].split(/\s*·\s*/) : [];

        return html`<label class="conj-cell"><span class="conj-lab ko">${pre.trim()}</span>${mkInput()}${post.trim() ? html`<span class="ko">${post.trim()}</span>` : null}</label>`; })}</div></div>`;

      return html`<label class="opt" for=${id}><input type="radio" name=${'r' + k} id=${id} value=${val} checked=${a === val} disabled=${ro} onChange=${() => setAns(k, val)} /><span class="ko">${(it.type === 'ox' ? '' : '①②③④⑤'[j] + ' ') + o[0]}</span>${o[1] ? html`<span class="th">${o[1]}</span>` : null}</label>`; })}</div>` : null}

/* ------------------------------------------------------------------ vocabulary drill (#vocab) — every word of the centre's vocabulary sheets 5–37, Leitner boxes

   dir 'cloze' = the sentence ex[exi] with the blank + its Thai translation, 4 Korean dictionary forms to choose from (distractors of the same word class — verb/adjective vs noun,

/* the accepted spellings of an entry: "정류장 [정뉴장]" → 정류장 · "(돈을) 쓰다" → 쓰다 / 돈을 쓰다 · "공부(를) 하다" → 공부 하다 / 공부를 하다 · "녹색(초록색)" → 녹색 / 초록색 ·

/* preferences (signals; saved with store.put) and the session */
const vsizeS = signal([20, 30, 40, 50].includes(+store.get('vocab:size', 40)) ? +store.get('vocab:size', 40) : 40);

const vfastS = signal(store.get('vocab:fast', 0) === 1);   // card mode: a right answer moves on by itself (otherwise the feedback with the example waits for ถัดไป)
const vnewS = signal([0, 10, 15, 20].includes(+store.get('vocab:newmin', 15)) ? +store.get('vocab:newmin', 15) : 15);   // slots of each daily session kept for NEW words: 15 by default so all 912 words are met before the 기말 (a 30-word session with 0 reserved met only ~180 words in 24 simulated days)
const vPref = (sig, key, v) => { sig.value = v; store.put('vocab:' + key, typeof v === 'boolean' ? +v : v); };
const vtabS = signal('today'), vresetS = signal(false);
/* the running session (null = none): { src, label, mode, queue: [{ko, retry}], total, done, ok, half, ng, first: {ko: first score}, phase: ask | fb | end, fb, mc, seq, at } —
   done counts words finished (right or half); a wrong word goes to the back of the queue until it is answered right */
const vsS = signal(null);
const vShuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* today's session: every DUE word (lowest box first, then the latest unit first), then NEW words in drill order — together up to the session size.

function vGrade(score, ans, key, pick) {

  const q = s.queue[0], b0 = (srsGet().w[q.ko] || {}).b || 0, queue = s.queue.slice(1), first = { ...s.first };
  if (first[q.ko] === undefined) first[q.ko] = score;
  if (score === 0) queue.push({ ko: q.ko, retry: true });
  batch(() => {
    const e = srsApply(q.ko, score);
    const nx = { ...s, queue, first, done: s.done + (score > 0 ? 1 : 0), ok: s.ok + (score === 1 ? 1 : 0), half: s.half + (score === .5 ? 1 : 0), ng: s.ng + (score === 0 ? 1 : 0), fb: { ko: q.ko, score, ans, key, b0, e, retry: q.retry, pick: pick || null } };
    vsS.value = { ...nx, phase: 'fb' };
  });
  if (vautoS.peek() && !(s.mode === 'card' && s.mc && s.mc.dir === 'k2t')) vSay(q.ko);   // k2t cards were already heard at the question
  if (s.mode === 'card' && score >= 1 && vfastS.peek()) { const seq = s.seq, at = s.at; setTimeout(() => { const c = vsS.peek(); if (c && c.phase === 'fb' && c.seq === seq && c.at === at) vNext(); }, 700); }
}
function vSubmit(text) {
  const s = vsS.peek(); if (!s || s.phase !== 'ask' || s.mode !== 'type') return;

  const [score, key] = judgeWord(ans, s.queue[0].ko); vGrade(score, ans, key);
}

function vNext() {
  const s = vsS.peek(); if (!s || s.phase !== 'fb') return;
  const i = $('#vq-in'); if (i) { i.value = ''; i.focus({ preventScroll: true }); }   // same element, same tap: the iPad keyboard stays open
  vsS.value = vAdvance(s); vAuto();
  later(() => { const c = $('#vcard'); if (c) c.scrollIntoView({ block: 'nearest' }); });
}
function vPick(i) {   // card mode: choice i (0–3) of the current card
  const s = vsS.peek(); if (!s || s.phase !== 'ask' || s.mode !== 'card' || !s.mc || !s.mc.opts[i]) return;
  const o = s.mc.opts[i], w = VBY[o.ko];
  vGrade(i === s.mc.ans ? 1 : 0, o.d, wordKeys(s.queue[0].ko).keys[0], { idx: i, ko: w.ko, th: w.th });
}
const vReset = () => { vresetS.value = false; vsS.value = null; store.set('vocab:srs', { w: {}, days: {}, ep: (srsGet().ep || 0) + 1 }); };   // a higher ep beats the other devices' older statistics

let vComp = false, vPend = false;
const vEnter = el => { const s = vsS.peek(); if (!s || s.mode !== 'type') return; if (s.phase === 'fb') vNext(); else vSubmit(el && el.value); };
const vKey = e => { if (e.key !== 'Enter' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;

  e.preventDefault(); vEnter(e.target); };
const vCompEnd = e => { vComp = false; if (vPend) { vPend = false; const el = e.target; later(() => vEnter(el)); } };
/* card mode on a keyboard: 1–4 = pick that choice, then Enter / Space = next card */
document.addEventListener('keydown', e => {

  const pct = s.total ? Math.round(100 * s.done / s.total) : 0, cls = fb ? (fb.score >= 1 ? 'ok' : fb.score > 0 ? 'half' : 'ng') : '';
  const head = html`<div class="vhead"><b class="ko">${s.label}</b><span class="muted">${typed ? '✍ พิมพ์' : '🃏 การ์ด'} · ${s.total} คำ</span><span class="sp"></span><button class="btn sm" type="button" id="vexit" onClick=${vExit}>✕ ออกจากชุดนี้</button></div>`;
  const prog = html`<div class=${'prog vprog' + (pct === 100 ? ' all' : '')} id="vprog"><div class="prog-row"><b id="vprog-n">ผ่านแล้ว ${s.done}/${s.total} คำ</b><span class="vtally" id="vtally"><span class="t-ok">✓ ${s.ok}</span><span class="t-half">≈ ${s.half}</span><span class="t-ng">✕ ${s.ng}</span></span><span class="sp"></span><span class="muted" id="vprog-p">${pct}%</span></div>
    <div class="prog-bar"><i id="vprog-a" style=${{ width: pct + '%' }}></i></div></div>`;
  const meta = html`<div class="vmeta"><span class="tag">${w.u}과</span>${w.cat ? html`<span class="tag">${w.cat}</span>` : null}${cur.retry ? html`<span class="tag vretry">🔁 ทวนซ้ำ</span>` : null}</div>`;
  if (typed) return html`<div class="vsess" id="vsess" key="type">${head}${prog}
    <div class="vcard" id="vcard">${meta}
      <div class="vth" id="vth">${w.th}</div><div class="ven" id="ven">${w.en}</div>
      <div class="vin">
        <input id="vq-in" class=${'vq-in' + (cls ? ' ' + cls : '')} type="text" lang="ko" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck=${false} placeholder="พิมพ์คำเกาหลี" aria-label="พิมพ์คำเกาหลีของคำนี้" onKeyDown=${vKey} oncompositionstart=${() => { vComp = true; vPend = false; }} oncompositionend=${vCompEnd} />
        ${fb ? html`<button class="btn primary" type="button" id="vq-next" onClick=${vNext}>ถัดไป ⏎</button>`
          : html`<button class="btn primary" type="button" id="vq-ok" onClick=${() => { vSubmit(($('#vq-in') || {}).value); vFocusNow(); }}>ตรวจ ⏎</button><button class="btn" type="button" id="vq-skip" onClick=${() => { vGiveUp(); vFocusNow(); }}>ไม่รู้</button>`}
      </div>
      ${fb ? html`<${VFb} fb=${fb} cls=${cls} />` : null}
    </div></div>`;
  const mc = s.mc, k2t = mc.dir === 'k2t', cz = mc.dir === 'cloze' && w.ex, pk = fb && fb.pick ? fb.pick.idx : -1;
  return html`<div class="vsess" id="vsess" key="card">${head}${prog}
    <div class="vcard" id="vcard">${meta}
      ${k2t ? html`<div class="vface"><div class="vko ko" id="vko">${w.ko}</div><button class="play" type="button" id="vplay" onClick=${() => vSay(w.ko)}>▶ ฟัง</button></div><p class="vask">คำนี้แปลว่าอะไร</p>`
        : cz ? html`<div class="vsent ko" id="vsent">${vSent(w.ex[mc.exi] || w.ex[0], !!fb)}</div><div class="vsent-t" id="vsent-t">🇹🇭 ${(w.ex[mc.exi] || w.ex[0])[1]}</div><p class="vask">เลือกคำที่เติมในช่องว่างได้ (ตัวเลือกเป็นรูปพจนานุกรม ในประโยคอาจผันรูปแล้ว)</p>`
        : html`<div class="vth" id="vth">${w.th}</div><div class="ven" id="ven">${w.en}</div><p class="vask">คำเกาหลีคือข้อไหน</p>`}
      <div class="vmc" id="vmc" role="group" aria-label="ตัวเลือก">${mc.opts.map((o, i) => html`<button type="button" class=${'vopt' + (k2t ? '' : ' ko') + (fb ? (i === mc.ans ? ' ok' : i === pk ? ' ng' : ' dim') : '')} id=${'vopt-' + i} disabled=${!!fb} onClick=${() => vPick(i)}><span class="k">${i + 1}</span><span class="d">${o.d}</span>${fb && i === mc.ans ? html`<span class="m">✓</span>` : fb && i === pk ? html`<span class="m">✕</span>` : null}</button>`)}</div>
      ${fb ? html`<${VFb} fb=${fb} cls=${cls} exi=${mc.exi} cz=${!!cz} /><div class="vin"><button class="btn primary" type="button" id="vq-next" onClick=${vNext}>ถัดไป ⏎</button></div>`
        : html`<p class="vkeys">คีย์ลัด: 1–4 = เลือกข้อ${k2t ? '' : ' · ยังไม่เล่นเสียงจนกว่าจะตอบ (ไม่ให้เฉลย)'}</p>`}
    </div></div>`;
}
